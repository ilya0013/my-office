<style>
  /* Мой офис: три вкладки в одном окне. «Офис» — пиксельный офис, статусы — пузыри над человечками.
     «Ваш ход» — что ждёт владельца: письма на «одобряю», одобренные к отправке, не подошедшие.
     «База» — все компании таблицей, как в Excel: стадия, сайт, почему, контакт, письмо с переводом.
     Решения владелец принимает в чате, экран только показывает */
  /* офис целиком в окне и не шире 860 px (крупнее — громоздко); ширину считает fitLayout по настоящим
     пропорциям комнаты — при третьем ряде столов она выше */

  body:not([data-moview="base"]):not([data-moview="you"]) .wrap { max-width:calc(var(--mo-stage-w, 860px) + 32px) !important; margin:0 auto; }   /* шапка и вкладки — по краю офиса */
  body[data-moview="base"] .wrap, body[data-moview="you"] .wrap { max-width:none !important; }   /* таблице — вся ширина */
  #mo-view { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:0 0 8px; }

  #mo-view button[aria-selected="true"] { background:var(--panel); color:var(--text); border-color:#4a4f6b; }
  #mo-view button b { font-weight:600; margin-inline-start:5px; }

  #mo-status.you { color:#ffe08a; }
  body[data-moview="base"] #mo-left, body[data-moview="you"] #mo-left, body:not([data-moview="base"]):not([data-moview="you"]) #mo { display:none; }
  body[data-moview="you"] #mo-csv { display:none; }

  footer, #cards { display:none; }   /* подсказка Cubicle и список команды не нужны: всё видно в офисе */
  .mo-p { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-width:0; }
  #mo .mute { color:var(--muted); }
  .mo-base-head { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:13px; margin-bottom:6px; }
  .mo-btn { background:#2b2f47; color:var(--text); border:1px solid #4a4f6b; border-radius:6px; padding:4px 12px; font:inherit; font-size:12.5px; cursor:pointer; text-decoration:none; display:inline-block; }
  .mo-btn:hover { border-color:var(--link); }
  .mo-btn.pri { background:#4a3d12; border-color:#8a7020; color:#ffe08a; }
  .mo-tbl-wrap { overflow-x:auto; }
  .mo-tbl { width:100%; min-width:900px; border-collapse:collapse; font-size:12.5px; }   /* узко — таблица листается вбок, а не сминается */
  .mo-tbl th { text-align:left; font-weight:600; color:var(--muted); padding:5px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .mo-tbl td { padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:break-word; }
  .mo-tbl td.why { min-width:200px; color:var(--muted); }
  .mo-tbl tr.you td:first-child { box-shadow:inset 3px 0 #c9a227; }
  .mo-chip { display:inline-block; font-size:11.5px; padding:1px 8px; border-radius:9px; background:#33374d; color:#c9cbe0; white-space:nowrap; }
  .mo-chip.you { background:#5a4a12; color:#ffe08a; } .mo-chip.good { background:#1f5130; color:#9ff0b4; } .mo-chip.bad { background:#2b2e40; color:#8b8da3; }
  .mo-tbl tr.letter td { background:#1d2033; }
  .mo-letters { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:10px; }
  .mo-letter { white-space:pre-wrap; font-size:12.5px; line-height:1.45; }
  .mo-letter h5 { margin:0 0 4px; font-size:12px; color:var(--muted); font-weight:600; }
  .mo-copy { margin-left:8px; background:rgba(158,197,255,0.08); border:1px solid var(--link); border-radius:999px; padding:1px 9px; color:var(--link); font:inherit; font-size:11.5px; font-weight:500; cursor:pointer; }
  .mo-copy:hover { background:rgba(158,197,255,0.2); }
</style>
<script>
/* «Мой офис»: события хуков (экран/events.js, строки ev({...});) → снимок в формате ленты Cubicle
   (docs/FEED.md). Файл перечитывается тегом <script> раз в 2 с, поэтому страница работает с двойного
   щелчка (file://), без сервера. ?src=имя.js — другой файл; demo*.js проигрывается по событию в 0,7 с. */
(function () {
  'use strict';
  const q = new URLSearchParams(location.search);
  const SRC = /^[\w.-]+\.js$/.test(q.get('src') || '') ? q.get('src') : 'events.js';
  const PLAY = /^demo/i.test(SRC) || q.has('play');
  const STEP_MS = Math.max(100, Number(q.get('step')) || 1300);
  const BASE_COLUMNS = ['запас', 'новый', 'не подходит', 'письмо готово', 'проверено', 'одобрено', 'отправлено', 'ответ', 'встреча', 'отказ'];
  // колонки конвейера: известные статусы и встреченные в файлах новые (перед «одобрено»)
  const cols = () => { const k = BASE_COLUMNS.indexOf('одобрено'); return [...BASE_COLUMNS.slice(0, k), ...S.extra, ...BASE_COLUMNS.slice(k)]; };
  const NAMES = { boss: 'Управляющий', scout: 'Скаут', manager: 'Аналитик', checker: 'Проверяющий', worker: 'Помощник Управляющего' };
  const TITLES = { boss: 'руководитель', scout: 'ищет кандидатов', manager: 'ведёт компанию', checker: 'проверяет письма', worker: 'служебное задание' };
  const COLORS = { 'Вы': '#ffffff', 'Управляющий': '#ffd75e', 'Скаут': '#6fcf97', 'Проверяющий': '#9ec5ff', 'Аналитик': '#f0a35e', 'Помощник Управляющего': '#c9cbe0' };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const short = (s, n = 60) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
  const baseName = (n) => String(n || '').replace(/ \d+$/, '');

  let buf = [];
  // ev({...}, мс): второй аргумент — время записи события хуком (в старых строках его нет — тогда время чтения)
  window.ev = (e, t) => { if (e && typeof e === 'object') { if (Number.isFinite(t) && t > 0) e.__t = t; buf.push(e); } };

  let S, all = [], applied = 0, zeroReads = 0, t0 = 0, missing = false;
  function mk(id, role, name, since) {
    return { id, role, name, status: 'idle', task: '', step: '', recent: [], parent: null, since, completedAt: null, assignedAt: null, returnedAt: null };
  }
  function reset() {
    S = { boss: mk('boss', 'boss', 'Управляющий', 0), slots: [], byAgent: new Map(), bySession: new Map(), bossSession: '',
      pending: [], leads: {}, flow: [], extra: [], written: new Set(), maxPar: 0, acts: {}, waitText: '', seq: 1 };
    applied = 0;
  }
  reset();

  // guess: роль угадывается по тексту (описание задания) — незнакомое слово тогда не роль
  function roleOf(t, guess) {
    t = String(t || '').toLowerCase().trim();
    if (/scout|развед/.test(t)) return 'scout';
    if (/check|провер/.test(t)) return 'checker';
    if (/analyst|аналит|manag|менедж/.test(t)) return 'manager';
    if (/^(general-purpose|explore|plan|claude-code-guide|statusline-setup|default|worker|explorer)$/.test(t)) return 'worker';
    const k = t.replace(/[^\wа-яё-]+/gi, '-').replace(/^-+|-+$/g, '').slice(0, 24);
    return guess || !k ? 'worker' : 'w-' + k;
  }
  const nameOf = (role) => NAMES[role] || (role.startsWith('w-') ? role[2].toUpperCase() + role.slice(3) : 'Сотрудник');
  const titleOf = (role) => TITLES[role] || 'сотрудник';
  // путь от корня проекта (cwd события); вне проекта — «…/имя», такой путь не станет ссылкой
  function rel(p, root) {
    const s = String(p || '').replace(/\\/g, '/'), r = String(root || '').replace(/\\/g, '/').replace(/\/+$/, '');
    if (r && s.toLowerCase().startsWith(r.toLowerCase() + '/')) return s.slice(r.length + 1);
    if (!/^([a-z]:)?\//i.test(s)) return s;
    const parts = s.split('/').filter(Boolean);
    const k = Math.max(parts.lastIndexOf('лиды'), parts.lastIndexOf('письма'));
    return k >= 0 ? parts.slice(k).join('/') : '…/' + (parts.pop() || '');
  }
  function host(u) { try { return new URL(u).host.replace(/^www\./, ''); } catch (_) { return short(u, 30); } }
  function describe(e) {
    const n = String(e.tool_name || '').toLowerCase(), i = e.tool_input || {};
    // Codex: webrun — поиск (search_query[].q) или открытие найденных страниц (open[])
    if (n === 'webrun') { const u = ((i.open || [])[0] || {}).ref_id || ''; return i.search_query && i.search_query.length ? '🔎 поиск: ' + short(i.search_query[0].q, 50) : '🌐 открывает ' + (/^https?:/.test(u) ? host(u) : 'страницы'); }
    if (/websearch|web_search|search_query/.test(n)) return '🔎 поиск: ' + short(i.query || i.q || (i.search_query && i.search_query[0] && i.search_query[0].q), 50);
    if (/webfetch|web_fetch|fetch|open_url/.test(n)) return '🌐 открыл сайт: ' + host(i.url || i.ref_id || '');
    if (/^(write|create|write_file)$/.test(n) || /^(edit|multiedit|str_replace|replace)$/.test(n)) return '✍ пишет ' + what(rel(i.file_path || i.path, e.cwd));
    if (/apply_patch/.test(n)) { const f = patchFiles(patchText(e)).map((x) => what(rel(x.path, e.cwd))); return '✍ пишет ' + short([...new Set(f)].join(', ') || 'файлы', 60); }
    if (/^(read|read_file|view)$/.test(n)) return '📖 читает ' + what(rel(i.file_path || i.path, e.cwd));
    if (/^(glob|grep|ls|list_directory|search_file_content)$/.test(n)) return '🗂 смотрит папку';
    if (/^(agent|task)$/.test(n) || /spawn_agent/.test(n)) return '📨 → ' + nameOf(roleOf(i.subagent_type || i.agent_type || i.role, !(i.subagent_type || i.agent_type || i.role)));
    if (/wait/.test(n)) return '⏳ ждёт сотрудников';
    if (/user_input|askuserquestion/.test(n)) return '❓ спрашивает вас в чате';
    if (/browser|cua|playwright|repl/.test(n)) { const u = (String(i.code || i.url || '').match(/https?:\/\/[^\s"'`)]+/) || [''])[0]; return '🌐 смотрит сайт' + (u ? ' ' + host(u) : ''); }
    if (/exec|shell|bash|command/.test(n)) return command([].concat(i.cmd || i.command || '').join(' '), e.cwd);
    if (/todo|plan/.test(n)) return '✅ составляет план';
    return n ? '⚙ работает' : '';
  }
  // Файл — словами: досье и письмо компании, каталог, правила, своя инструкция
  function what(p) {
    p = String(p || '');
    const m = p.match(/(лиды|письма|ответы)\/([^\/]+?)\.md$/);
    if (m && m[2].startsWith('_')) return 'шаблон досье';
    if (m) { const t = (S.leads[m[2]] && S.leads[m[2]].title) || m[2]; return { 'лиды': 'досье ', 'письма': 'письмо ', 'ответы': 'ответ ' }[m[1]] + t; }
    if (/каталог\.md$/.test(p)) return 'каталог';
    if (/ПРАВИЛА\.md$/i.test(p)) return 'правила';
    if (/роли\//.test(p)) return 'свою инструкцию';
    if (/ваш-ход\.md$/.test(p)) return '«Ваш ход»';
    if (/(^|\/)_шаблон/.test(p)) return 'шаблон досье';
    if (/SKILL\.md$/i.test(p)) return 'инструкцию инструмента';
    return short(p.split('/').pop() || 'файл', 40);
  }
  // Команда (Codex читает и правит файлы командами) — по смыслу, без текста команды
  function command(c, cwd) {
    const files = [...String(c).matchAll(/[\wА-Яа-яЁё\/:.\\-]+\.md/g)].map((m) => what(rel(m[0], cwd)));
    const list = short([...new Set(files)].join(', '), 50);
    if (/Invoke-WebRequest|curl|wget/i.test(c)) return '🌐 открывает сайт';
    // правят сотрудники только досье и письма; каталог, правила и роли в команде — это чтение
    const own = short([...new Set(files.filter((f) => /^(досье|письмо|ответ) /.test(f)))].join(', '), 50);
    if (/Set-Content|Out-File|WriteAllText|Add-Content|\.Replace\(|sed\s+-i|>\s*\S+\.md/i.test(c)) return '✍ правит ' + (own || 'файлы');
    if (/Get-Content|\bcat\b|\btype\b|Select-String|\brg\b|\bgrep\b/i.test(c)) return '📖 читает ' + (list || 'файлы');
    if (/Get-ChildItem|\bls\b|\bdir\b/i.test(c)) return '🗂 смотрит папку';
    return '⚙ работает';
  }

  // Статусы компаний: файл лиды/<имя>.md (не _шаблон) и строка «статус: X» в том, что пишется.
  function strings(x, out = []) {
    if (typeof x === 'string') out.push(x);
    else if (x && typeof x === 'object') for (const v of Object.values(x)) strings(v, out);
    return out;
  }
  function patchText(e) { return strings(e.tool_input).find((s) => s.includes('*** Begin Patch') || /\*\*\* (Add|Update) File:/.test(s)) || ''; }
  function patchFiles(text) {
    const out = [], re = /\*\*\* (?:Add|Update) File: ([^\r\n]+)\r?\n([\s\S]*?)(?=\r?\n\*\*\* |$)/g;
    let m;
    while ((m = re.exec(text))) out.push({ path: m[1].trim(), text: m[2].split(/\r?\n/).filter((l) => l[0] === '+').map((l) => l.slice(1)).join('\n') });
    return out;
  }
  function leadWrites(e) {
    const n = String(e.tool_name || '').toLowerCase(), i = e.tool_input || {};
    const path = i.file_path || i.path || '';
    if (/^(write|create|write_file)$/.test(n)) return [{ path, text: String(i.content || i.contents || '') }];
    if (/^(edit|str_replace|replace)$/.test(n)) return [{ path, text: String(i.new_string || i.new_str || '') }];
    if (n === 'multiedit') return [{ path, text: (i.edits || []).map((x) => x.new_string || '').join('\n') }];
    const p = patchText(e);
    if (p) return patchFiles(p);
    // Codex: сотрудник иногда меняет файл командой (python/PowerShell replace + запись). Берём, только если в
    // команде один файл лиды/<имя>.md, есть запись в файл и «статус: X» — последний из них новый.
    if (/bash|shell|exec|command/.test(n)) {
      const cmd = [].concat(i.command || i.cmd || '').join(' ');
      const files = [...new Set([...cmd.matchAll(/лиды[\\/]+([^\\/'"`\s]+?)\.md/g)].map((m) => m[1]))].filter((f) => !f.startsWith('_'));
      const writes = /write_text|Set-Content|Add-Content|Out-File|WriteAllText|sed\s+-i|>\s*['"]?лиды/i.test(cmd);
      const st = [...cmd.matchAll(/статус:\s*([^'"`\r\n\\|]+?)\s*(?=['"`\r\n\\])/g)];
      if (files.length === 1 && writes && st.length) return [{ path: `лиды/${files[0]}.md`, text: 'статус: ' + st[st.length - 1][1] }];
    }
    return [];
  }
  function trackLeads(e, who, at) {
    for (const w of leadWrites(e)) {
      S.written.add(rel(w.path, e.cwd));
      const f = String(w.path).match(/(?:^|[\\/])лиды[\\/]+([^\\/]+?)\.md\s*$/i);
      if (!f || f[1].startsWith('_')) continue;
      const st = w.text.match(/(?:^|\n)[\s>*-]*\**статус\**\s*:\s*`?([^`\r\n]+?)`?\s*(?:\r?\n|$)/i);
      const co = w.text.match(/(?:^|\n)\s*\**компания\**\s*:\s*([^\r\n]+)/i);
      const slug = f[1], lead = S.leads[slug];
      if (lead && co) lead.title = short(co[1].replace(/\s*\(.*$/, ''), 40);
      if (!st) continue;
      const status = st[1].trim().toLowerCase().replace(/[.;,]+$/, '');
      if (!BASE_COLUMNS.includes(status) && !S.extra.includes(status)) {
        if (!/^[a-zа-яё][a-zа-яё -]{0,28}$/i.test(status)) continue;   // «новый | разобран» из шаблона — не статус
        S.extra.push(status);
      }
      if (!lead) S.leads[slug] = { title: co ? short(co[1].replace(/\s*\(.*$/, ''), 40) : slug, status, by: who.name, at };
      else if (lead.status !== status) { lead.status = status; lead.by = who.name; lead.at = at; }
      else continue;
      flow(at, who.name, '📋', status, slug);
    }
  }

  // Сводка из файлов от хука в конце хода — правда важнее догадок по командам сотрудников
  function syncFiles(leads, at) {
    for (const [slug, f] of Object.entries(leads)) {
      const status = String(f['статус'] || '').trim().toLowerCase().replace(/[.;,]+$/, '');
      if (f['письмо']) S.written.add(`письма/${slug}.md`);
      if (!status || !/^[a-zа-яё][a-zа-яё -]{0,28}$/i.test(status)) continue;
      if (!BASE_COLUMNS.includes(status) && !S.extra.includes(status)) S.extra.push(status);
      const title = f['компания'] ? short(String(f['компания']).replace(/\s*\(.*$/, ''), 40) : slug;
      const lead = S.leads[slug];
      if (!lead) S.leads[slug] = { title, status, by: '', at };
      else { lead.title = title; if (lead.status !== status) { lead.status = status; lead.at = at; flow(at, 'Файлы', '📋', status, slug); } }
    }
    // снимок файлов полный: компании нет в лиды/ (проба перенесена, файл удалён) — нет и на экране
    for (const slug of Object.keys(S.leads)) if (!(slug in leads)) delete S.leads[slug];
  }
  function flow(at, from, to, text, slug) { S.flow.push({ at, from, to, text, slug }); if (S.flow.length > 200) S.flow.shift(); }
  function step(a, text, at) {
    if (!text) return;
    a.step = text;
    a.recent.push([at, text]);
    if (a.recent.length > 10) a.recent.shift();
  }
  const runningSubs = () => S.slots.filter((x) => x.status === 'running').length;

  function startSlot(e, at) {
    const role = roleOf(e.agent_type || e.agent_role || e.subagent_type);
    let k = S.pending.findIndex((p) => p.role === role);
    if (k < 0 && S.pending.length) k = 0;
    const job = k >= 0 ? S.pending.splice(k, 1)[0] : null;
    // Свободный сотрудник той же роли берёт новое задание сам; одновременно занятым заводим «Аудитор 2».
    let a = S.slots.find((x) => x.role === role && x.status !== 'running');
    if (!a) {
      const n = S.slots.filter((x) => x.role === role).length + 1;
      a = mk(`${role}-${n}`, role, nameOf(role) + (n > 1 ? ' ' + n : ''), S.seq++);
      a.parent = 'boss';
      S.slots.push(a);
    }
    const own = e.description ? short(e.description, 70).replace(new RegExp('^' + nameOf(role).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*:\\s*', 'i'), '') : '';
    a.status = 'running'; a.task = own || (job ? job.desc : ''); a.recent = []; a.assignedAt = at; a.step = '';
    step(a, '📥 получил задание', at);
    if (e.agent_id) S.byAgent.set(e.agent_id, a);
    if (e.session_id && S.bossSession && e.session_id !== S.bossSession) S.bySession.set(e.session_id, a);
    flow(at, 'Управляющий', a.name, a.task || 'новое задание');
    S.maxPar = Math.max(S.maxPar, runningSubs());
    return a;
  }
  function stopSlot(a, e, at) {
    if (a.status !== 'running' && a.status !== 'waiting') return;
    a.status = 'idle'; a.completedAt = a.returnedAt = at;
    step(a, '✅ сдал работу', at);
    const m = String(e.last_assistant_message || '').match(/Главное:\s*([^\r\n]+)/);
    flow(at, a.name, 'Управляющий', 'сдал работу' + (m ? ' — ' + short(m[1], 90) : ''));
  }
  function actor(e, kind) {
    if (e.agent_id) return S.byAgent.get(e.agent_id) || (kind === 'SubagentStart' ? null : startSlot(e, Date.now()));
    const sid = e.session_id || '';

  }

  function apply(e, at) {
    const kind = e.hook_event_name || e.event || e.type || '';
    if (kind === 'MoFiles') { syncFiles(e.leads || {}, at); S.decDirty = true; return; }
    if (kind === 'SubagentStart') {
      const known = e.agent_id && S.byAgent.get(e.agent_id);
      if (known && known.status !== 'running') S.byAgent.delete(e.agent_id);   // тот же id получил новое задание

    }

    // Запрос разрешения (Claude Code и Codex) — человечек ждёт вашего «Разрешить», а не печатает
    if (kind === 'PermissionRequest') {

      const m = String(e.tool_name || '');
      who.status = 'waiting'; who.waitText = '⏳ ждёт «Разрешить»' + (m ? ' — ' + short(m, 80) : ''); who.permAt = at;
      step(who, '⏳ ждёт вашего «Разрешить»', at);
      flow(at, who.name, 'Вы', 'ждёт «Разрешить»');

    if (who === B) S.waitText = '';

      const t0 = i.subagent_type || i.agent_type || i.role;
      const role = t0 ? roleOf(t0) : roleOf(i.description, true);
      // Codex: message зашифрован (без пробелов) — не показываем; задание тогда из task_name: scout_first → «scout first»
      const msg = typeof i.message === 'string' && /\s/.test(i.message) ? i.message : '';
      let desc = short(i.description || (i.task_name ? String(i.task_name).replace(/_+/g, ' ') : '') || msg || i.prompt || i.task || '', 70);
      desc = desc.replace(new RegExp('^' + nameOf(role).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*:\\s*', 'i'), '');
      S.pending.push({ role, desc });
    }
    step(who, describe(e), at);
    const nm = baseName(who.name);
    S.acts[nm] = (S.acts[nm] || 0) + 1;
    trackLeads(e, who, at);
  }

  function out(a) {
    // Codex «Подтверждать за меня» решает запрос сам за секунды — руку поднимаем, только если ждут дольше 8 с
    const st = a.status === 'waiting' && a.permAt && Date.now() - a.permAt < 8000 ? 'running' : a.status;
    const t = st === 'waiting' ? (a.waitText || S.waitText || 'ждёт вашего решения') : a.task;

  // «База»: статус файла → стадия словами; порядок строк — по ходу работы, сначала то, что ждёт вас
  const STAGE = { 'проверено': ['ждёт вашего «одобряю»', 'you'], 'одобрено': ['одобрено — отправьте', 'you'], 'новый': ['найдена', ''],

  // проба мастера настройки: видна в «Базе», но не ждёт вашего «одобряю»
  const probe = (slug) => /^да/i.test(String((D && D[slug] && D[slug]['проба']) || ''));
  const waiting = () => Object.entries(S.leads).filter(([slug, l]) => l.status === 'проверено' && !probe(slug)).length;
  const mailOf = (d) => (String(d['кому'] || d['контакт'] || '').match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/) || [''])[0];
  const site = (u) => (/^https?:\/\//.test(u || '') ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(String(u).replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''))}</a>` : esc(u || ''));
  function rows() {

    const at = (st) => (ORDER.includes(st) ? ORDER.indexOf(st) : ORDER.length);
    return all.sort((x, y) => at(x[1].status) - at(y[1].status));

  // Файлы офиса — открыть и посмотреть, как он устроен (.md откроется текстом); свёрнуто, раскрытие помнится

  let D = null, decLoading = false;
  const opened = {};
  window.dec = (d) => { if (d && typeof d === 'object') D = d; };
  function readDec() {
    if (decLoading) return;
    decLoading = true;
    const el = document.createElement('script');
    el.src = 'решения.js?t=' + Date.now();
    el.onload = el.onerror = () => { el.remove(); decLoading = false; render(); };
    document.head.appendChild(el);
  }
  // Markdown письма → текст: ссылка на сайт кликабельна (по ней владелец проверяет письмо), прочие — текстом; заголовок — жирным
  const md = (s) => esc(String(s || '').trim()).replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/^#+\s*(.+)$/gm, '<b>$1</b>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  const plain = (s) => String(s || '').trim().replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1 ($2)');
  // Скачать для Excel: .xlsx без библиотек (zip без сжатия) — одинаково открывается в Excel, Numbers и Google Таблицах
  const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = (b) => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  function zip(files) {
    const enc = new TextEncoder(), parts = [], dir = [];
    let off = 0;
    const u16 = (v) => [v & 255, (v >>> 8) & 255], u32 = (v) => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
    for (const [name, text] of files) {
      const nb = enc.encode(name), data = enc.encode(text), c = crc32(data);
      const common = [...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(c), ...u32(data.length), ...u32(data.length), ...u16(nb.length), ...u16(0)];
      const local = new Uint8Array([...u32(0x04034b50), ...common]);
      parts.push(local, nb, data);
      dir.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...common, ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nb);
      off += local.length + nb.length + data.length;
    }
    const size = dir.reduce((n, x) => n + x.length, 0);
    return new Blob([...parts, ...dir, new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(size), ...u32(off), ...u16(0)])],
      { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  function xlsx() {
    const x = (v) => String(v ?? '').trim().replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const head = ['Компания', 'Город', 'Сайт', 'Стадия', 'Почему подходит', 'Контакт', 'Тема', 'Письмо', 'Перевод'];
    const data = [head, ...rows().map(([slug, l, d]) => [l.title, d['город'], d['сайт'], (probe(slug) ? 'проба · ' : '') + (STAGE[l.status] || [l.status])[0], d['почему'], mailOf(d) || d['контакт'], d['тема'], plain(d['письмо']), plain(d['перевод'])])];
    const X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>', M = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
    const R = 'http://schemas.openxmlformats.org/package/2006/relationships', O = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
    const sheet = `${X}<worksheet xmlns="${M}"><cols><col min="1" max="7" width="22" customWidth="1"/><col min="8" max="9" width="60" customWidth="1"/></cols><sheetData>`
      + data.map((r, ri) => `<row r="${ri + 1}">` + r.map((v, ci) => `<c r="${String.fromCharCode(65 + ci)}${ri + 1}" t="inlineStr"${ri ? ' s="1"' : ''}><is><t xml:space="preserve">${x(v)}</t></is></c>`).join('') + '</row>').join('')
      + '</sheetData></worksheet>';
    const ct = 'application/vnd.openxmlformats-officedocument.spreadsheetml';
    download(zip([
      ['[Content_Types].xml', `${X}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="${ct}.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="${ct}.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="${ct}.styles+xml"/></Types>`],
      ['_rels/.rels', `${X}<Relationships xmlns="${R}"><Relationship Id="rId1" Type="${O}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
      ['xl/workbook.xml', `${X}<workbook xmlns="${M}" xmlns:r="${O}"><sheets><sheet name="Компании" sheetId="1" r:id="rId1"/></sheets></workbook>`],
      ['xl/_rels/workbook.xml.rels', `${X}<Relationships xmlns="${R}"><Relationship Id="rId1" Type="${O}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${O}/styles" Target="styles.xml"/></Relationships>`],
      ['xl/styles.xml', `${X}<styleSheet xmlns="${M}"><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
      ['xl/worksheets/sheet1.xml', sheet],
    ]), 'компании.xlsx');
  }
  function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  // Копировать тему или письмо — вставить в любую почту без подключения
  function copy(text, btn, msg) {
    const done = () => { const t0 = btn.textContent; btn.textContent = msg || '✓ скопировано'; setTimeout(() => { btn.textContent = t0; }, msg ? 8000 : 1500); };
    const fail = () => { btn.textContent = 'Не скопировалось — выделите текст письма и скопируйте сами'; };
    const old = () => { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove(); ok ? done() : fail(); };
    try { navigator.clipboard.writeText(text).then(done, old); } catch (_) { old(); }
  }
  document.addEventListener('click', (e) => {
    const t = e.target.closest && e.target.closest('[data-letter],[data-view],[data-copy],[data-open],[data-mail],#mo-csv');
    if (!t) return;
    // встроенный браузер Claude Code не открывает почту (mailto): окно не потеряло фокус за 1,5 с —
    // кнопка предлагает скопировать письмо; копируем только по нажатию, буфер сами не трогаем
    if (t.dataset.mail) {
      if (t.dataset.fallback) { e.preventDefault(); return copy(plain(((D && D[t.dataset.mail]) || {})['письмо']), t, '✓ письмо скопировано — вставьте в новое письмо, тему скопируйте слева'); }
      let left = false; const away = () => { left = true; };
      window.addEventListener('blur', away);
      setTimeout(() => { window.removeEventListener('blur', away); if (!left && !document.hidden) { t.dataset.fallback = '1'; t.textContent = 'Почта не открылась? Нажмите — скопирую письмо'; } }, 1500);
      return;
    }
    if (t.dataset.open) { opened[t.dataset.open] = true; return showView('base'); }   // «читать» во «Ваш ход» — письмо в «Базе»
    if (t.id === 'mo-csv') return xlsx();
    if (t.dataset.copy) { const [kind, slug] = t.dataset.copy.split(':'), d = (D && D[slug]) || {}; return copy(kind === 'тема' ? String(d['тема'] || '') : plain(d['письмо']), t); }
    if (t.dataset.view) return showView(t.dataset.view);
    opened[t.dataset.letter] = !opened[t.dataset.letter]; render();
  });

  // Вкладки «Офис», «Ваш ход» и «База»; выбор помнится
  let view = 'office';
  try { const v = localStorage.getItem('myoffice.view'); if (v === 'base' || v === 'you') view = v; } catch (_) {}
  function showView(v) {
    view = v; document.body.dataset.moview = v;
    document.querySelectorAll('#mo-view [data-view]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.view === v)));
    try { localStorage.setItem('myoffice.view', v); } catch (_) {}
    if (v === 'office') window.dispatchEvent(new Event('resize'));   // офис был скрыт — пересчитать размер
    render();
  }
  let placed = false;
  function place() { if (placed) return; placed = true; showView(view); render(); }

  window.MO = { snapshot, place, teamRow, linkText, empty: () => applied === 0, src: SRC, label: SRC === 'events.js' ? '' : 'демо: ' + SRC };

  // ---------- без сервера: всё сетевое отвечает локально ----------
  // Cubicle читает /config.json и ленту /api/feed; остальное (настройки, Telegram, GitHub, обновления) — «нет».
  const json = (x) => new Response(JSON.stringify(x), { status: 200, headers: { 'content-type': 'application/json' } });
  window.fetch = function (u) {
    const url = String((u && u.url) || u || '');
    if (/(^|\/)config\.json$/.test(url)) return Promise.resolve(json({ source: 'feed', label: '' }));
    if (url === '/api/feed') return snapshot().then(json);
    return Promise.resolve(new Response('', { status: 404, statusText: 'Not Found' }));
  };
})();
</script>
