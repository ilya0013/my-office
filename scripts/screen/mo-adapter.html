<style>
  /* Мой офис. Широкое окно (≥1100 px): слева офис, справа вкладки «Сейчас от вас» и «Компании» — колонка
     ровно по окну, листается только открытая вкладка. Узкое (встроенный браузер рядом с чатом): офис сверху,
     под ним те же вкладки. Кто чем занят — пузыри над человечками, отдельного списка команды нет */
  body:not(.kiosk) #stage { width:min(100%, calc((100vh - var(--mo-reserve, 150px)) * 352 / 208)); margin:0 auto; }
  body.mo-wide:not(.kiosk) #stage { --mo-reserve: 90px; }

  #mo { display:flex; flex-direction:column; gap:8px; margin-top:8px; min-width:0; }

  body.mo-wide footer { display:none; }
  body.mo-wide .wrap { padding-bottom:8px; }
  #mo-tabs { display:flex; gap:4px; flex-wrap:wrap; }
  #mo-tabs button { background:none; border:1px solid var(--line); color:var(--muted); border-radius:6px; padding:5px 12px; font:inherit; font-size:13px; cursor:pointer; }
  #mo-tabs button[aria-selected="true"] { background:var(--panel); color:var(--text); border-color:#4a4f6b; }

  [data-motab="now"] #mo > [data-pane="now"], [data-motab="board"] #mo > [data-pane="board"] { display:block; }
  body.mo-wide #mo > [data-pane] { flex:0 1 auto; min-height:0; overflow:auto; }
  #mo > [data-pane] > h3 { display:none; }
  .mo-p { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 10px; min-width:0; }
  .mo-p h3 { margin:0 0 5px; font-size:11.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }

  #mo-now.you { border-color:#8a7020; background:#2e2814; }

  /* доска: узко — стадии друг под другом, от 860 px — пять колонок */

  @container (min-width: 860px) { #mo-board { grid-template-columns:repeat(5, minmax(0, 1fr)); align-items:start; } }
  .mo-col { background:#1d2033; border-radius:6px; padding:5px 7px; min-width:0; }
  .mo-col h4 { margin:0; font-size:12.5px; color:var(--muted); font-weight:600; display:flex; justify-content:space-between; gap:6px; }
  .mo-col.you h4 { color:#ffe08a; }
  .mo-card { font-size:12.5px; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 7px; margin-top:5px; overflow-wrap:anywhere; }
  .mo-col.you .mo-card { border-color:#8a7020; }
  .mo-card .mute { font-size:12px; }
  .mo-card .by { font-size:12px; color:#9ec5ff; }
  .mo-card .files { font-size:12px; color:var(--muted); }
  .mo-how { font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.45; }
  .mo-how b { color:var(--text); font-weight:600; }
  #mo-now .hint { font-size:12px; color:var(--muted); padding-top:6px; }
  .mo-go { background:none; border:0; padding:0; font:inherit; color:var(--link); text-decoration:underline; cursor:pointer; }
  .mo-card details summary { cursor:pointer; color:var(--link); font-size:12.5px; margin-top:3px; }
  .mo-letter { white-space:pre-wrap; background:#1d2033; border-radius:6px; padding:6px 8px; margin-top:4px; font-size:12.5px; line-height:1.4; }
  .mo-letter.tr { color:#c9cbe0; }
  #mo-rest { font-size:12px; color:var(--muted); margin-top:6px; overflow-wrap:anywhere; }
  #mo-rest:empty { display:none; }
  /* команда — строками */
  #cards { display:none; }   /* список Cubicle не показываем: статусы — пузыри над человечками */
  #cards .card { background:none; border:0; border-top:1px solid var(--line); border-radius:0; padding:4px 0; }
  #cards .card:first-child { border-top:0; }
  .mo-tr { display:flex; align-items:center; gap:7px; font-size:12.5px; min-width:0; white-space:nowrap; }
  .mo-tr .sw { width:9px; height:9px; border-radius:50%; flex:none; }
  .mo-tr b { cursor:pointer; }
  .mo-tr .pill { margin:0; flex:none; }
  .mo-tr .mo-task { min-width:0; flex:0 1 auto; overflow:hidden; text-overflow:ellipsis; }
  .mo-tr .mo-step { min-width:0; flex:1 1 0; overflow:hidden; text-overflow:ellipsis; color:var(--muted); }
  #cards .steps { margin:1px 0 0 16px; font-size:12px; }
  /* фраза для чата: экран с чатом не связан — щелчок только копирует её, отвечает человек сам */
  .mo-say { background:#2b2f47; color:var(--text); border:1px solid #4a4f6b; border-radius:12px; padding:2px 10px; margin:3px 4px 1px 0; font:inherit; font-size:12.5px; cursor:pointer; }
  .mo-say:hover { border-color:var(--link); }
  .mo-say.pri { background:#4a3d12; border-color:#8a7020; color:#ffe08a; font-weight:600; }
  a.mo-say { display:inline-block; text-decoration:none; }
  .mo-sub { margin-top:2px; }
  #mo-toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#1f5130; color:#dcffe2; border-radius:8px; padding:7px 14px; font-size:13px; z-index:20; box-shadow:0 6px 20px rgba(0,0,0,.4); display:none; }
</style>
<script>
/* «Мой офис»: события хуков (экран/events.js, строки ev({...});) → снимок в формате ленты Cubicle
   (docs/FEED.md). Файл перечитывается тегом <script> раз в 2 с, поэтому страница работает с двойного
   щелчка (file://), без сервера. ?src=имя.js — другой файл; demo*.js проигрывается по событию в 0,7 с. */
(function () {
  'use strict';
  const q = new URLSearchParams(location.search);
  const SRC = /^[\w.-]+\.js$/.test(q.get('src') || '') ? q.get('src') : 'events.js';
  const PLAY = /^demo/i.test(SRC) || q.has('play');
  const STEP_MS = Math.max(100, Number(q.get('step')) || 1300);
  const BASE_COLUMNS = ['запас', 'новый', 'не подходит', 'письмо готово', 'проверено', 'одобрено', 'отправлено', 'ответ', 'встреча', 'отказ'];
  // колонки конвейера: известные статусы и встреченные в файлах новые (перед «одобрено»)
  const cols = () => { const k = BASE_COLUMNS.indexOf('одобрено'); return [...BASE_COLUMNS.slice(0, k), ...S.extra, ...BASE_COLUMNS.slice(k)]; };
  const NAMES = { boss: 'Босс', scout: 'Разведчик', manager: 'Менеджер', checker: 'Проверяющий', worker: 'Сотрудник' };
  const TITLES = { boss: 'руководитель', scout: 'ищет кандидатов', manager: 'ведёт компанию', checker: 'проверяет письма', worker: 'помощник' };
  const COLORS = { 'Вы': '#ffffff', 'Босс': '#ffd75e', 'Разведчик': '#6fcf97', 'Проверяющий': '#9ec5ff', 'Менеджер': '#f0a35e', 'Сотрудник': '#c9cbe0' };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const short = (s, n = 60) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
  const baseName = (n) => String(n || '').replace(/ \d+$/, '');

  let buf = [];
  // ev({...}, мс): второй аргумент — время записи события хуком (в старых строках его нет — тогда время чтения)
  window.ev = (e, t) => { if (e && typeof e === 'object') { if (Number.isFinite(t) && t > 0) e.__t = t; buf.push(e); } };

  let S, all = [], applied = 0, zeroReads = 0, t0 = 0, missing = false;
  function mk(id, role, name, since) {
    return { id, role, name, status: 'idle', task: '', step: '', recent: [], parent: null, since, completedAt: null, assignedAt: null, returnedAt: null };
  }
  function reset() {
    S = { boss: mk('boss', 'boss', 'Босс', 0), slots: [], byAgent: new Map(), bySession: new Map(), bossSession: '',
      pending: [], leads: {}, flow: [], extra: [], written: new Set(), maxPar: 0, acts: {}, waitText: '', seq: 1 };
    applied = 0;
  }
  reset();

  // guess: роль угадывается по тексту (описание задания) — незнакомое слово тогда не роль
  function roleOf(t, guess) {
    t = String(t || '').toLowerCase().trim();
    if (/scout|развед/.test(t)) return 'scout';
    if (/check|провер/.test(t)) return 'checker';
    if (/manag|менедж/.test(t)) return 'manager';
    const k = t.replace(/[^\wа-яё-]+/gi, '-').replace(/^-+|-+$/g, '').slice(0, 24);
    return guess || !k ? 'worker' : 'w-' + k;
  }
  const nameOf = (role) => NAMES[role] || (role.startsWith('w-') ? role[2].toUpperCase() + role.slice(3) : 'Сотрудник');
  const titleOf = (role) => TITLES[role] || 'сотрудник';
  // путь от корня проекта (cwd события); вне проекта — «…/имя», такой путь не станет ссылкой
  function rel(p, root) {
    const s = String(p || '').replace(/\\/g, '/'), r = String(root || '').replace(/\\/g, '/').replace(/\/+$/, '');
    if (r && s.toLowerCase().startsWith(r.toLowerCase() + '/')) return s.slice(r.length + 1);
    if (!/^([a-z]:)?\//i.test(s)) return s;
    const parts = s.split('/').filter(Boolean);
    const k = Math.max(parts.lastIndexOf('лиды'), parts.lastIndexOf('письма'));
    return k >= 0 ? parts.slice(k).join('/') : '…/' + (parts.pop() || '');
  }
  function host(u) { try { return new URL(u).host.replace(/^www\./, ''); } catch (_) { return short(u, 30); } }
  function describe(e) {
    const n = String(e.tool_name || '').toLowerCase(), i = e.tool_input || {};
    // Codex: webrun — поиск (search_query[].q) или открытие найденных страниц (open[])
    if (n === 'webrun') return i.search_query && i.search_query.length ? '🔎 поиск: ' + short(i.search_query[0].q, 50) : '🌐 открывает страницы';
    if (/websearch|web_search|search_query/.test(n)) return '🔎 поиск: ' + short(i.query || i.q || (i.search_query && i.search_query[0] && i.search_query[0].q), 50);
    if (/webfetch|web_fetch|fetch|open_url/.test(n)) return '🌐 открыл сайт: ' + host(i.url || i.ref_id || '');
    if (/^(write|create|write_file)$/.test(n) || /^(edit|multiedit|str_replace|replace)$/.test(n)) return '✍ пишет ' + short(rel(i.file_path || i.path, e.cwd), 60);
    if (/apply_patch/.test(n)) { const f = patchFiles(patchText(e)).map((x) => rel(x.path, e.cwd)); return '✍ пишет ' + short(f.join(', ') || 'файлы', 60); }
    if (/^(read|read_file|view)$/.test(n)) return '📖 читает ' + short(rel(i.file_path || i.path, e.cwd), 60);
    if (/^(glob|grep|ls|list_directory|search_file_content)$/.test(n)) return '🗂 смотрит папку ' + short(i.pattern || i.path || '', 30);
    if (/^(agent|task)$/.test(n) || /spawn_agent/.test(n)) return '📨 → ' + nameOf(roleOf(i.subagent_type || i.agent_type || i.role, !(i.subagent_type || i.agent_type || i.role)));
    if (/wait/.test(n)) return '⏳ ждёт сотрудников';
    if (/exec|shell|bash|command/.test(n)) return '⌨ команда: ' + short([].concat(i.cmd || i.command || '').join(' '), 36);
    if (/todo|plan/.test(n)) return '✅ составляет план';
    return n ? '⚙ ' + short(e.tool_name, 24) : '';
  }

  // Статусы компаний: файл лиды/<имя>.md (не _шаблон) и строка «статус: X» в том, что пишется.
  function strings(x, out = []) {
    if (typeof x === 'string') out.push(x);
    else if (x && typeof x === 'object') for (const v of Object.values(x)) strings(v, out);
    return out;
  }
  function patchText(e) { return strings(e.tool_input).find((s) => s.includes('*** Begin Patch') || /\*\*\* (Add|Update) File:/.test(s)) || ''; }
  function patchFiles(text) {
    const out = [], re = /\*\*\* (?:Add|Update) File: ([^\r\n]+)\r?\n([\s\S]*?)(?=\r?\n\*\*\* |$)/g;
    let m;
    while ((m = re.exec(text))) out.push({ path: m[1].trim(), text: m[2].split(/\r?\n/).filter((l) => l[0] === '+').map((l) => l.slice(1)).join('\n') });
    return out;
  }
  function leadWrites(e) {
    const n = String(e.tool_name || '').toLowerCase(), i = e.tool_input || {};
    const path = i.file_path || i.path || '';
    if (/^(write|create|write_file)$/.test(n)) return [{ path, text: String(i.content || i.contents || '') }];
    if (/^(edit|str_replace|replace)$/.test(n)) return [{ path, text: String(i.new_string || i.new_str || '') }];
    if (n === 'multiedit') return [{ path, text: (i.edits || []).map((x) => x.new_string || '').join('\n') }];
    const p = patchText(e);
    if (p) return patchFiles(p);
    // Codex: сотрудник иногда меняет файл командой (python/PowerShell replace + запись). Берём, только если в
    // команде один файл лиды/<имя>.md, есть запись в файл и «статус: X» — последний из них новый.
    if (/bash|shell|exec|command/.test(n)) {
      const cmd = [].concat(i.command || i.cmd || '').join(' ');
      const files = [...new Set([...cmd.matchAll(/лиды[\\/]+([^\\/'"`\s]+?)\.md/g)].map((m) => m[1]))].filter((f) => !f.startsWith('_'));
      const writes = /write_text|Set-Content|Add-Content|Out-File|WriteAllText|sed\s+-i|>\s*['"]?лиды/i.test(cmd);
      const st = [...cmd.matchAll(/статус:\s*([^'"`\r\n\\|]+?)\s*(?=['"`\r\n\\])/g)];
      if (files.length === 1 && writes && st.length) return [{ path: `лиды/${files[0]}.md`, text: 'статус: ' + st[st.length - 1][1] }];
    }
    return [];
  }
  function trackLeads(e, who, at) {
    for (const w of leadWrites(e)) {
      S.written.add(rel(w.path, e.cwd));
      const f = String(w.path).match(/(?:^|[\\/])лиды[\\/]+([^\\/]+?)\.md\s*$/i);
      if (!f || f[1].startsWith('_')) continue;
      const st = w.text.match(/(?:^|\n)[\s>*-]*\**статус\**\s*:\s*`?([^`\r\n]+?)`?\s*(?:\r?\n|$)/i);
      const co = w.text.match(/(?:^|\n)\s*\**компания\**\s*:\s*([^\r\n]+)/i);
      const slug = f[1], lead = S.leads[slug];
      if (lead && co) lead.title = short(co[1].replace(/\s*\(.*$/, ''), 40);
      if (!st) continue;
      const status = st[1].trim().toLowerCase().replace(/[.;,]+$/, '');
      if (!BASE_COLUMNS.includes(status) && !S.extra.includes(status)) {
        if (!/^[a-zа-яё][a-zа-яё -]{0,28}$/i.test(status)) continue;   // «новый | разобран» из шаблона — не статус
        S.extra.push(status);
      }
      if (!lead) S.leads[slug] = { title: co ? short(co[1].replace(/\s*\(.*$/, ''), 40) : slug, status, by: who.name, at };
      else if (lead.status !== status) { lead.status = status; lead.by = who.name; lead.at = at; }
      else continue;
      flow(at, who.name, '📋', status, slug);
    }
  }

  // Сводка из файлов от хука в конце хода — правда важнее догадок по командам сотрудников
  function syncFiles(leads, at) {
    for (const [slug, f] of Object.entries(leads)) {
      const status = String(f['статус'] || '').trim().toLowerCase().replace(/[.;,]+$/, '');
      if (f['письмо']) S.written.add(`письма/${slug}.md`);
      if (!status || !/^[a-zа-яё][a-zа-яё -]{0,28}$/i.test(status)) continue;
      if (!BASE_COLUMNS.includes(status) && !S.extra.includes(status)) S.extra.push(status);
      const title = f['компания'] ? short(String(f['компания']).replace(/\s*\(.*$/, ''), 40) : slug;
      const lead = S.leads[slug];
      if (!lead) S.leads[slug] = { title, status, by: '', at };
      else { lead.title = title; if (lead.status !== status) { lead.status = status; lead.at = at; flow(at, 'Файлы', '📋', status, slug); } }
    }
  }
  function flow(at, from, to, text, slug) { S.flow.push({ at, from, to, text, slug }); if (S.flow.length > 200) S.flow.shift(); }
  function step(a, text, at) {
    if (!text) return;
    a.step = text;
    a.recent.push([at, text]);
    if (a.recent.length > 10) a.recent.shift();
  }
  const runningSubs = () => S.slots.filter((x) => x.status === 'running').length;

  function startSlot(e, at) {
    const role = roleOf(e.agent_type || e.agent_role || e.subagent_type);
    let k = S.pending.findIndex((p) => p.role === role);
    if (k < 0 && S.pending.length) k = 0;
    const job = k >= 0 ? S.pending.splice(k, 1)[0] : null;
    // Свободный сотрудник той же роли берёт новое задание сам; одновременно занятым заводим «Аудитор 2».
    let a = S.slots.find((x) => x.role === role && x.status !== 'running');
    if (!a) {
      const n = S.slots.filter((x) => x.role === role).length + 1;
      a = mk(`${role}-${n}`, role, nameOf(role) + (n > 1 ? ' ' + n : ''), S.seq++);
      a.parent = 'boss';
      S.slots.push(a);
    }
    const own = e.description ? short(e.description, 70).replace(new RegExp('^' + nameOf(role).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*:\\s*', 'i'), '') : '';
    a.status = 'running'; a.task = own || (job ? job.desc : ''); a.recent = []; a.assignedAt = at; a.step = '';
    step(a, '📥 получил задание', at);
    if (e.agent_id) S.byAgent.set(e.agent_id, a);
    if (e.session_id && S.bossSession && e.session_id !== S.bossSession) S.bySession.set(e.session_id, a);
    flow(at, 'Босс', a.name, a.task || 'новое задание');
    S.maxPar = Math.max(S.maxPar, runningSubs());
    return a;
  }
  function stopSlot(a, e, at) {
    if (a.status !== 'running') return;
    a.status = 'idle'; a.completedAt = a.returnedAt = at;
    step(a, '✅ сдал работу', at);
    const m = String(e.last_assistant_message || '').match(/Главное:\s*([^\r\n]+)/);
    flow(at, a.name, 'Босс', 'сдал работу' + (m ? ' — ' + short(m[1], 90) : ''));
  }
  function actor(e, kind) {
    if (e.agent_id) return S.byAgent.get(e.agent_id) || (kind === 'SubagentStart' ? null : startSlot(e, Date.now()));
    const sid = e.session_id || '';
    if (sid && !S.bossSession && kind !== 'SubagentStart') S.bossSession = sid;
    if (sid && S.bossSession && sid !== S.bossSession) {
      // Codex: у субагента свой session_id; без agent_id привязываем его к последнему запущенному
      let a = S.bySession.get(sid);
      if (!a) { a = [...S.slots].reverse().find((x) => x.status === 'running' && ![...S.bySession.values()].includes(x)); if (a) S.bySession.set(sid, a); }
      if (a) return a;
      // никто из сотрудников не работает — это новая сессия самого Босса (владелец открыл новый чат)
      S.bossSession = sid;
    }
    return S.boss;
  }

  function apply(e, at) {
    const kind = e.hook_event_name || e.event || e.type || '';
    if (kind === 'MoFiles') { syncFiles(e.leads || {}, at); S.decDirty = true; return; }
    if (kind === 'SubagentStart') {
      const known = e.agent_id && S.byAgent.get(e.agent_id);
      if (known && known.status !== 'running') S.byAgent.delete(e.agent_id);   // тот же id получил новое задание
      const a = known && known.status === 'running' ? known : startSlot(e, at);
      if (e.source === 'agent') {
        // Codex: Босс сам пишет, кого отправил, — значит, он за столом и раздаёт работу
        S.boss.status = 'running'; S.waitText = '';
        step(S.boss, '📨 → ' + baseName(a.name), at);
      }
      return;
    }
    const who = actor(e, kind), B = S.boss;
    if (kind === 'SubagentStop') { if (who !== B) stopSlot(who, e, at); return; }
    if (kind === 'Stop') {
      if (who !== B) { stopSlot(who, e, at); return; }
      B.completedAt = at;
      // source:"agent" — Босс сам сообщил, что ждёт владельца
      const bg = e.source !== 'agent' && ((e.background_tasks || []).some((t) => t && t.status === 'running') || runningSubs() > 0);
      if (bg) { B.status = 'running'; step(B, '⏳ ждёт сотрудников', at); }   // сидит за столом и ждёт отчётов
      else {
        B.status = 'waiting';
        S.waitText = short(String(e.last_assistant_message || '').split(/\r?\n/).find((l) => l.trim()) || '', 140);
        step(B, '🙋 ждёт вас', at);
        flow(at, 'Босс', 'Вы', 'ждёт вашего решения' + (S.waitText ? ' — ' + S.waitText : ''));
      }
      return;
    }
    if (kind === 'UserPromptSubmit') {
      if (who !== B) return;
      // Codex-приложение оборачивает сообщение: <in-app-browser-context …>…</…> и «## My request:» — берём сам текст
      let p = String(e.prompt || '');
      if (!/^\s*<task-notification>/.test(p)) {
        p = p.replace(/<([\w-]+)[^>]*>[\s\S]*?<\/\1>/g, '');
        const m = p.match(/##\s*My request:\s*([\s\S]*)$/i);
        p = (m ? m[1] : p).trim();
      }
      B.status = 'running'; S.waitText = '';
      if (/^\s*<task-notification>/.test(p)) step(B, '📬 читает отчёт', at);
      else { B.task = short(p, 80); step(B, '💬 задание от вас', at); flow(at, 'Вы', 'Босс', short(p, 90)); }
      return;
    }
    if (kind === 'PostToolUse') { trackLeads(e, who, at); return; }
    if (!e.tool_name) return;
    const n = String(e.tool_name).toLowerCase(), i = e.tool_input || {};
    who.status = 'running';
    if (who === B) S.waitText = '';
    if (/^(agent|task)$/.test(n) || /spawn_agent/.test(n)) {
      const t0 = i.subagent_type || i.agent_type || i.role;
      const role = t0 ? roleOf(t0) : roleOf(i.description, true);
      // Codex: message зашифрован (без пробелов) — не показываем; задание тогда из task_name: scout_first → «scout first»
      const msg = typeof i.message === 'string' && /\s/.test(i.message) ? i.message : '';
      let desc = short(i.description || (i.task_name ? String(i.task_name).replace(/_+/g, ' ') : '') || msg || i.prompt || i.task || '', 70);
      desc = desc.replace(new RegExp('^' + nameOf(role).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*:\\s*', 'i'), '');
      S.pending.push({ role, desc });
    }
    step(who, describe(e), at);
    const nm = baseName(who.name);
    S.acts[nm] = (S.acts[nm] || 0) + 1;
    trackLeads(e, who, at);
  }

  function out(a) {
    const t = a.status === 'waiting' ? (S.waitText || 'ждёт вашего решения') : a.task;
    return { id: a.id, name: a.name, role: titleOf(a.role), status: a.status, since: a.since,
      task: t || a.step ? { title: t || '', step: a.status === 'running' ? a.step : '' } : null,
      parent: a.parent, recent: a.recent.slice(), completedAt: a.completedAt, assignedAt: a.assignedAt, returnedAt: a.returnedAt };
  }

  let loading = null, lastTry = 0;
  function readFile() {
    if (loading) return loading;
    loading = new Promise((res) => {
      buf = [];
      const el = document.createElement('script');
      el.src = SRC + '?t=' + Date.now();
      el.onload = () => { el.remove(); res(buf.slice()); };
      el.onerror = () => { el.remove(); res(null); };
      document.head.appendChild(el);
    }).then((x) => { loading = null; return x; });
    return loading;
  }

  async function snapshot() {
    // нет файла — браузер пишет в консоль ошибку загрузки; пока файла нет, проверяем реже (раз в 6 с)
    const skip = missing && Date.now() - lastTry < 6000;
    if (!skip) lastTry = Date.now();
    let got = skip ? null : await readFile();
    missing = got === null;
    if (got) {
      const other = got.length && all.length && got[0].session_id && all[0].e.session_id && got[0].session_id !== all[0].e.session_id;
      if (got.length < all.length || other) {
        // ноль событий после непустого файла — строка дописывается или файл битый: держим, что показано
        if (got.length === 0) got = null;
        else { reset(); all = []; t0 = 0; }
      }
      if (got) { zeroReads = 0; for (let i = all.length; i < got.length; i++) all.push({ e: got[i] }); }
    }
    if (all.length && !t0) t0 = Date.now();
    const limit = PLAY ? Math.min(all.length, Math.floor((Date.now() - t0) / STEP_MS) + 1) : all.length;
    // Codex: Босс и сотрудники сами дописывают события с source:"agent". Если в файле есть настоящие события
    // хуков той же сессии (или у агентского события нет сессии), агентские пропускаем — иначе всё вдвойне.
    const realS = new Set(all.filter((x) => x.e.source !== 'agent').map((x) => x.e.session_id || ''));
    const dup = (e) => e.source === 'agent' && realS.size > 0 && (!e.session_id || realS.has(e.session_id));
    if (realS.size && S.agentApplied && all.slice(0, applied).some((x) => dup(x.e))) reset();   // уже показали — пересобрать без них
    while (applied < limit) {
      const e = all[applied].e;
      if (!dup(e)) { try { apply(e, (!PLAY && e.__t) || Date.now()); if (e.source === 'agent') S.agentApplied = true; } catch (_) {} }
      applied++;
    }
    if (S.decDirty && !PLAY) { S.decDirty = false; readDec(); }   // хук переписал решения.js перед снимком
    render();
    return { company: '', agents: [S.boss, ...S.slots].map(out) };
  }

  // ---------- панели ----------
  // сравниваем с прошлой строкой, не с innerHTML: браузер его нормализует (open → open=""), и панель перерисовывалась бы каждый раз
  const shown = {};
  const set = (id, html) => { const el = document.getElementById(id); if (el && shown[id] !== html) { el.innerHTML = html; shown[id] = html; } };
  // Ссылки на файлы проекта: страница лежит в экран/, корень проекта — '../'. .md откроется текстом.
  const fileA = (path, text) => (PLAY || !S.written.has(path) ? text : `<a href="../${esc(encodeURI(path))}" target="_blank" rel="noopener" title="откроется текстом">${text}</a>`);
  const FILE_RE = /(^|[\s,(])((?:[\wА-Яа-яЁё.-]+\/)*[\wА-Яа-яЁё-][\wА-Яа-яЁё.-]*\.(?:md|txt|csv|json|html))(?=$|[\s,;)])/g;
  function linkText(text) { return esc(text).replace(FILE_RE, (m, pre, path) => pre + fileA(path, path)); }
  const leadA = (slug, text) => fileA(`лиды/${slug}.md`, esc(text));
  function linkSlugs(html) {
    for (const slug of Object.keys(S.leads)) {
      const re = new RegExp('(^|[\\s:(])(' + slug.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?=$|[\\s,.;:)])', 'g');
      html = html.replace(re, (m, pre, x) => pre + leadA(slug, x));
    }
    return html;
  }
  function teamRow(s, label) {
    const t = s.task || {};
    return `<div class="mo-tr"><span class="sw" style="background:${esc(s.shirt)}"></span><b class="pick" data-id="${esc(s.id)}">${esc(s.name)}</b>`
      + `<span class="pill p-${esc(s.status)}">${label}</span><span class="mo-task" title="${esc(t.title || '')}">${linkSlugs(esc(t.title || ''))}</span>`
      + `<span class="mo-step">${linkText(t.step || '')}</span></div>`;
  }

  // Доска: компания идёт слева направо; жёлтые колонки — там, где нужен человек
  const STAGES = [['Найдены', ['новый']], ['Пишем и проверяем', ['письмо готово']], ['Ждут вашего «одобряю»', ['проверено'], 1],
    ['Отправьте сами', ['одобрено'], 1], ['Отправлены', ['отправлено', 'ответ', 'встреча']]];
  const info = (slug) => (D && D[slug]) || {};
  const mailOf = (d) => (String(d['кому'] || '').match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/) || [''])[0];
  // кто из сотрудников сейчас ведёт компанию: её имя есть в задании
  const busyWith = (slug) => S.slots.find((a) => a.status === 'running' && String(a.task || '').toLowerCase().includes(slug.toLowerCase()));
  function card(slug, l, stage) {
    const d = info(slug), w = busyWith(slug);
    const files = PLAY ? '' : [S.written.has(`лиды/${slug}.md`) && fileA(`лиды/${slug}.md`, 'досье'), S.written.has(`письма/${slug}.md`) && fileA(`письма/${slug}.md`, 'письмо')].filter(Boolean).join(' · ');
    let h = `<div class="mo-card"><b>${esc(l.title)}</b>${files ? ` <span class="files">· ${files}</span>` : ''}`
      + (d['почему'] ? `<div class="mute">${esc(short(d['почему'], 120))}</div>` : '')
      + (w ? `<div class="by">✍ ${esc(w.name)} работает над ней</div>` : '');
    if (stage === 2) h += (d['письмо'] ? `<details data-open="${esc(slug)}"${opened[slug] ? ' open' : ''}><summary>прочитать письмо и перевод</summary>`
        + `<div class="mo-letter">${md(d['письмо'])}</div>${d['перевод'] ? `<div class="mo-letter tr">${md(d['перевод'])}</div>` : ''}</details>`
        : PLAY ? '<div class="mute">В демо писем нет — в вашем офисе здесь откроется письмо с переводом.</div>' : '')
      + `<div class="mo-how">Напишите Боссу в чате:<br>${say('одобряю ' + slug)} — письмо перейдёт в «Отправьте сами»;<br>`
      + `${say('поправь ' + slug + ': что изменить')} — Менеджер перепишет, Проверяющий проверит, письмо вернётся сюда.</div>`;
    if (stage === 3) {
      const mail = mailOf(d);
      h += (mail ? `<div class="mo-sub"><a class="mo-say pri" href="${esc(`mailto:${mail}?subject=${encodeURIComponent(d['тема'] || '')}&body=${encodeURIComponent(plain(d['письмо']))}`)}">✉ открыть в своей почте</a></div>` : '')
        + `<div class="mo-how">Отправили — напишите Боссу ${say('отправил ' + slug)}, карточка уйдёт в «Отправлены».</div>`;
    }
    return h + '</div>';
  }
  function render() {
    if (!document.getElementById('mo')) return;
    const leads = Object.entries(S.leads);
    const of = (sts) => leads.filter(([, l]) => sts.includes(l.status));
    set('mo-board', STAGES.map(([name, sts, you], i) => {
      const list = of(sts);
      return `<div class="mo-col${you && list.length ? ' you' : ''}"><h4><span>${esc(name)}</span><span>${list.length || '—'}</span></h4>${list.map(([slug, l]) => card(slug, l, i)).join('')}</div>`;
    }).join(''));
    const known = [...STAGES.flatMap((x) => x[1]), 'запас', 'не подходит', 'отказ'];
    const names = (list) => list.map(([slug, l]) => leadA(slug, l.title)).join(', ');
    const rest = [['В запасе', of(['запас'])], ['Не подошли', of(['не подходит', 'отказ'])], ['Другое', leads.filter(([, l]) => !known.includes(l.status))]];
    set('mo-rest', leads.length ? rest.filter(([, list]) => list.length).map(([k, list]) => `${k}: ${names(list)}`).join('<br>')
      : 'Компаний пока нет. Напишите Боссу в чате: «найди 5 компаний».');

    // «Сейчас от вас нужно» — одно-два действия с готовой фразой; ничего не нужно — так и пишем
    const mgr = S.slots.some((a) => a.role === 'manager' && a.status === 'running');
    const found = of(['новый']), wait = of(['проверено']), ok = of(['одобрено']), need = [];
    const go = '<button type="button" class="mo-go" data-go="board">Компании</button>';
    if (S.boss.status === 'waiting' && found.length && !mgr) need.push(`<li><b>Найдено компаний: ${found.length}.</b> Посмотрите их во вкладке ${go} и напишите Боссу`
      + `<div class="mo-sub">${say('запускай все', 'pri')} — начнут писать письма · ${say('убери имя')} — уберёт лишнюю</div></li>`);
    if (wait.length) need.push(`<li><b>Писем ждут вашего решения: ${wait.length}.</b> Прочитайте во вкладке ${go} и напишите Боссу «одобряю имя»`
      + (wait.length > 1 ? `<div class="mo-sub">${say('одобряю все', 'pri')} — все письма сразу</div>` : '') + '</li>');
    if (ok.length) need.push(`<li><b>Одобрено писем: ${ok.length}.</b> Отправьте со своей почты — кнопка ✉ на карточке во вкладке ${go}.</li>`);
    if (!need.length && S.boss.status === 'waiting') need.push(`<li>Босс ответил в чате и ждёт вас${S.waitText ? ': «' + esc(S.waitText) + '»' : ''}</li>`);
    document.getElementById('mo-now').classList.toggle('you', need.length > 0);
    set('mo-now-n', need.length ? `<b class="you">${need.length}</b>` : '');
    set('mo-board-n', leads.length ? `<b>${leads.length}</b>` : '');
    if (need.length) need.push('<li class="hint">Экран только показывает — отвечаете вы Боссу в чате. Фразу в рамке можно скопировать щелчком.</li>');
    set('mo-wait', need.join('') || `<li class="mute">${missing && !all.length ? 'Жду первого события — напишите Боссу в чате.' : 'Ничего — команда работает, можно просто смотреть.'}</li>`);
  }

  // Данные карточек (почему, письмо, адрес) — решения.js, хук переписывает его в конце хода
  let D = null, decLoading = false;
  const opened = {};
  window.dec = (d) => { if (d && typeof d === 'object') D = d; };
  function readDec() {
    if (decLoading) return;
    decLoading = true;
    const el = document.createElement('script');
    el.src = 'решения.js?t=' + Date.now();
    el.onload = el.onerror = () => { el.remove(); decLoading = false; render(); };
    document.head.appendChild(el);
  }
  // Markdown письма → текст: ссылка — её текст, заголовок — жирным
  const md = (s) => esc(String(s || '').trim()).replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/^#+\s*(.+)$/gm, '<b>$1</b>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  const plain = (s) => String(s || '').trim().replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1 ($2)');
  document.addEventListener('toggle', (e) => { const o = e.target.dataset && e.target.dataset.open; if (o) opened[o] = e.target.open; }, true);

  const say = (text, cls = '') => `<button type="button" class="mo-say ${cls}" data-say="${esc(text)}" title="скопировать для чата">«${esc(text)}»</button>`;
  function copyText(text) {
    const fallback = () => {
      const t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} t.remove(); return ok;
    };
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(() => true, fallback);
    return Promise.resolve(fallback());
  }
  let toastTimer = 0;
  function toast(msg) {
    let el = document.getElementById('mo-toast');
    if (!el) { el = document.createElement('div'); el.id = 'mo-toast'; document.body.appendChild(el); }
    el.textContent = msg; el.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2600);
  }
  document.addEventListener('click', (e) => {
    const g = e.target.closest && e.target.closest('[data-go]');
    if (g) { showTab(g.dataset.go); return; }
    const b = e.target.closest && e.target.closest('[data-say]'); if (!b) return;
    const text = b.dataset.say;
    copyText(text).then((ok) => toast(ok ? `«${text}» скопировано — вставьте в чат Боссу` : `Скопируйте вручную: ${text}`));
  });

  // Вкладки «Сейчас от вас» и «Компании»
  const TABS = ['now', 'board'];
  let tab = 'now';
  try { const t = localStorage.getItem('myoffice.tab2'); if (TABS.includes(t)) tab = t; } catch (_) {}
  function showTab(t) {
    tab = t; document.body.dataset.motab = t;
    document.querySelectorAll('#mo-tabs [data-tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
    try { localStorage.setItem('myoffice.tab2', t); } catch (_) {}
  }
  let placed = false;
  function place() {
    const tabs = document.getElementById('mo-tabs');
    if (placed || !tabs) return;
    placed = true;
    tabs.addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) showTab(b.dataset.tab); });
    showTab(tab);
    render();
  }

  window.MO = { snapshot, place, teamRow, linkText, empty: () => applied === 0, src: SRC, label: SRC === 'events.js' ? '' : 'демо: ' + SRC };

  // ---------- без сервера: всё сетевое отвечает локально ----------
  // Cubicle читает /config.json и ленту /api/feed; остальное (настройки, Telegram, GitHub, обновления) — «нет».
  const json = (x) => new Response(JSON.stringify(x), { status: 200, headers: { 'content-type': 'application/json' } });
  window.fetch = function (u) {
    const url = String((u && u.url) || u || '');
    if (/(^|\/)config\.json$/.test(url)) return Promise.resolve(json({ source: 'feed', label: '' }));
    if (url === '/api/feed') return snapshot().then(json);
    return Promise.resolve(new Response('', { status: 404, statusText: 'Not Found' }));
  };
})();
</script>
