# «Мой офис»: Босс — главный чат. Настройки действуют, только если проекту доверяют (trusted).
model = "gpt-6.1-sol"
model_reasoning_effort = "low"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false  # терминалу сеть не нужна: сайты открывает встроенный поиск Codex
